<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brew &amp; Bean Coffee Shop</title>
  <meta name="description" content="Brew & Bean Coffee Shop — freshly brewed coffee, cozy moments, and good company.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/home.css">
  <link rel="stylesheet" href="css/about.css">
  <link rel="stylesheet" href="css/menu.css">
  <link rel="stylesheet" href="css/gallery.css">
  <link rel="stylesheet" href="css/contact.css">
</head>
<body>
  <div id="page-loader" class="page-loader" role="status" aria-live="polite">
    <div class="loader-mark">
      <svg viewBox="0 0 48 48" aria-hidden="true">
        <path d="M12 16h20a2 2 0 0 1 2 2v10a10 10 0 0 1-10 10h-4A10 10 0 0 1 10 28V18a2 2 0 0 1 2-2z" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M34 20h4a4 4 0 0 1 0 8h-4" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M18 8c1 2 1 4 0 6M24 7c1 2.5 1 5 0 7M30 8c1 2 1 4 0 6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
      <p>Brewing your experience…</p>
    </div>
  </div>

  <header class="site-header" id="site-header">
    <div class="nav-inner">
      <a href="#home" class="brand" aria-label="Brew &amp; Bean home">
        <span class="brand-icon" aria-hidden="true">
          <svg viewBox="0 0 48 48">
            <path d="M12 16h20a2 2 0 0 1 2 2v10a10 10 0 0 1-10 10h-4A10 10 0 0 1 10 28V18a2 2 0 0 1 2-2z" fill="none" stroke="currentColor" stroke-width="2"/>
            <path d="M34 20h4a4 4 0 0 1 0 8h-4" fill="none" stroke="currentColor" stroke-width="2"/>
            <path d="M18 8c1 2 1 4 0 6M24 7c1 2.5 1 5 0 7M30 8c1 2 1 4 0 6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
        </span>
        <span class="brand-text">
          <strong>Brew &amp; Bean</strong>
          <small>Coffee Shop</small>
        </span>
      </a>

      <button class="nav-toggle" id="nav-toggle" aria-label="Open menu" aria-expanded="false" aria-controls="site-nav">
        <span></span><span></span><span></span>
      </button>

      <nav class="site-nav" id="site-nav" aria-label="Primary">
        <ul>
          <li><a href="#home" class="is-active">Home</a></li>
          <li><a href="#about">About</a></li>
          <li><a href="#menu">Menu</a></li>
          <li><a href="#gallery">Gallery</a></li>
          <li><a href="#contact">Contact</a></li>
        </ul>
        <a href="#menu" class="btn btn-nav">Order Now</a>
      </nav>
    </div>
  </header>

  <main id="app">
    <div id="home-container" data-section="home"></div>
    <div id="about-container" data-section="about"></div>
    <div id="menu-container" data-section="menu"></div>
    <div id="gallery-container" data-section="gallery"></div>
    <div id="contact-container" data-section="contact"></div>
  </main>

  <div id="load-errors" class="load-errors" hidden></div>

  <footer class="site-footer">
    <div class="container footer-grid">
      <div class="footer-brand">
        <span class="brand-icon" aria-hidden="true">
          <svg viewBox="0 0 48 48">
            <path d="M12 16h20a2 2 0 0 1 2 2v10a10 10 0 0 1-10 10h-4A10 10 0 0 1 10 28V18a2 2 0 0 1 2-2z" fill="none" stroke="currentColor" stroke-width="2"/>
            <path d="M34 20h4a4 4 0 0 1 0 8h-4" fill="none" stroke="currentColor" stroke-width="2"/>
          </svg>
        </span>
        <div>
          <strong>Brew &amp; Bean</strong>
          <small>Coffee Shop</small>
        </div>
      </div>
      <p class="footer-tagline">Good Coffee. Better Days.</p>
      <div class="footer-social" aria-label="Social media">
        <a href="#" aria-label="Instagram">IG</a>
        <a href="#" aria-label="Facebook">FB</a>
        <a href="#" aria-label="TikTok">TT</a>
      </div>
    </div>
    <p class="footer-copy">© 2026 Brew &amp; Bean Coffee Shop. All rights reserved.</p>
  </footer>

  <script src="js/script.js" defer></script>
</body>
</html>
